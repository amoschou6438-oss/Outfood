<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戶外活動餐點統計表</title>
<!-- 手機加入主畫面圖示 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="戶外活動餐點">
<meta name="theme-color" content="#3B5B3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3E9;
    --card:#FFFFFF;
    --ink:#2B3A2C;
    --ink-soft:#5C6B57;
    --ink-faint:#8B9686;
    --line:#D8DCC9;
    --moss:#3B5B3E;
    --moss-dark:#28401F;
    --mustard:#C1852B;
    --mustard-light:#F3E3C4;
    --danger:#A8482D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 40px;}

  /* header */
  .head{
    background:var(--moss);
    color:#F2F3E9;
    border-radius:16px;
    padding:26px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  .head::before{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px; height:140px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .eyebrow{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--mustard-light); font-weight:700; margin:0 0 8px;
  }
  h1{
    font-family:'Noto Serif TC',serif;
    font-size:24px; font-weight:700; margin:0 0 4px; line-height:1.4;
  }
  .sub{font-size:13px; color:#C9D3C1; margin:0;}
  .stats{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .stat{
    background:rgba(255,255,255,0.09);
    border-radius:10px;
    padding:8px 14px;
    min-width:84px;
  }
  .stat .n{font-size:20px; font-weight:700; font-family:'Noto Serif TC',serif;}
  .stat .l{font-size:11px; color:#C9D3C1;}

  /* area select */
  .area-select-block{
    margin-top:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .area-select-block label{
    display:block; font-size:13px; font-weight:700; color:var(--moss-dark);
    margin-bottom:8px;
  }
  .area-select-block select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  .area-select-block select:focus{outline:2px solid var(--moss); outline-offset:1px;}

  /* category detail / back button */
  .back-btn{
    margin-top:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 16px;
    font-size:13px;
    font-weight:700;
    color:var(--moss-dark);
    cursor:pointer;
  }
  .back-btn:hover{background:var(--mustard-light); border-color:var(--mustard);}
  .cat-detail-head{
    display:flex; align-items:center; gap:10px;
    margin-top:14px; margin-bottom:4px;
  }
  .cat-detail-head .dot{width:12px; height:12px;}
  .cat-detail-head .cat-name{font-size:18px;}
  .cat-detail-icon{
    width:36px; height:36px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--mustard-light);
    flex-shrink:0;
    display:inline-block;
  }
  .cat-detail-icon img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .switch-section{margin-top:24px;}
  .switch-title{
    font-size:13px; font-weight:700; color:var(--moss-dark);
    margin-bottom:10px;
  }

  /* icon grid */
  .icon-grid{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  @media (min-width:520px){
    .icon-grid{grid-template-columns:repeat(4, 1fr);}
  }
  .icon-btn-tile{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px 6px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .icon-btn-tile:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 10px rgba(43,58,44,0.12);
    border-color:var(--mustard);
  }
  .icon-btn-tile:active{transform:translateY(0);}
  .icon-img-wrap{
    width:56px; height:56px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--mustard-light);
    flex-shrink:0;
  }
  .icon-img-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .icon-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--moss-dark);
    text-align:center;
    line-height:1.3;
  }
  .icon-count{
    font-size:10px;
    color:var(--ink-faint);
    font-weight:500;
  }

  /* category cards */
  .cats{margin-top:22px; display:flex; flex-direction:column; gap:14px;}
  .cat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .cat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .cat-title{display:flex; align-items:center; gap:10px;}
  .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .cat-name{font-weight:700; font-size:15px;}
  .cat-count{font-size:12px; color:var(--ink-faint); margin-left:2px;}
  .chev{font-size:13px; color:var(--ink-faint); transition:transform .15s;}
  .cat.open .chev{transform:rotate(180deg);}

  .cat-body{display:none; padding:0 16px 16px;}
  .cat.open .cat-body{display:block;}
  .cat.static .cat-body{display:block; padding:16px;}

  .entry{
    border-top:1px dashed var(--line);
    padding:12px 2px;
    display:flex; justify-content:space-between; gap:10px;
    align-items:center;
  }
  .entry.confirming{background:#FBEFEA; border-radius:8px; margin-top:2px;}
  .confirm-row{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .confirm-text{font-size:12px; color:var(--danger); font-weight:700;}
  .confirm-btn{
    border:none; border-radius:6px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .confirm-yes{background:var(--danger); color:#fff;}
  .confirm-no{background:#fff; color:var(--ink-soft); border:1px solid var(--line);}
  .entry:first-child{border-top:1px dashed var(--line);}
  .entry-main{font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .entry-meta{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
  .badge{
    display:inline-block; font-size:11px; font-weight:700;
    padding:1px 7px; border-radius:20px; margin-right:6px;
    background:var(--mustard-light); color:#7A5217;
  }
  .entry-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    border:none; background:transparent; color:var(--ink-faint);
    font-size:16px; cursor:pointer; padding:2px 4px; line-height:1;
  }
  .icon-btn:hover{color:var(--danger);}

  .empty-row{
    padding:14px 2px; font-size:13px; color:var(--ink-faint); font-style:italic;
  }

  .add-btn{
    margin-top:10px;
    width:100%;
    padding:9px;
    border:1px dashed var(--line);
    background:var(--paper);
    border-radius:10px;
    color:var(--moss-dark);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .add-btn:hover{background:var(--mustard-light); border-color:var(--mustard);}

  /* form */
  .form{
    margin-top:10px;
    background:var(--paper);
    border-radius:10px;
    padding:12px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .form.show{display:flex;}
  .form label{font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:2px; display:block;}
  .form input, .form select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .form input:focus, .form select:focus{outline:2px solid var(--moss); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .err{font-size:12px; color:var(--danger); display:none;}
  .err.show{display:block;}
  .form-actions{display:flex; gap:8px; margin-top:4px;}
  .btn{
    flex:1; padding:9px; border-radius:8px; border:none;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .btn-primary{background:var(--moss); color:#fff;}
  .btn-primary:hover{background:var(--moss-dark);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}

  .footer-note{
    text-align:center; font-size:12px; color:var(--ink-faint); margin-top:22px;
  }
  .reset-link{
    text-align:center; margin-top:8px;
  }
  .reset-link button{
    background:none; border:none; color:var(--ink-faint); font-size:11px;
    text-decoration:underline; cursor:pointer;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--moss-dark); color:#fff; padding:9px 18px;
    border-radius:20px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  /* line icon tile */
  .line-icon-wrap{border-color:#06C755;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,58,44,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-box{
    background:#fff; border-radius:16px; padding:24px 20px;
    max-width:340px; width:100%; text-align:center;
  }
  .modal-icon{font-size:32px; margin-bottom:10px;}
  .modal-text{font-size:14px; color:var(--ink); line-height:1.6; margin:0 0 10px;}
  .modal-thanks{font-size:14px; color:var(--moss-dark); font-weight:700; margin:0 0 18px;}
  .modal-actions{display:flex; gap:10px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="eyebrow">戶外活動 · 餐點認領表</p>
    <h1>中區青少班<br>11月戶外活動餐點系統</h1>
    <p class="sub">點選各分類新增你要提供的餐點，全部前賢共用同一份清單</p>
    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">已認領項目</div></div>
      <div class="stat"><div class="n" id="statCats">0</div><div class="l">已有項目分類</div></div>
      <div class="stat"><div class="n" id="statEmpty">7</div><div class="l">尚待認領分類</div></div>
    </div>
  </div>

  <div id="homeView">
    <div class="area-select-block">
      <label for="globalAreaSelect">請先選擇提供餐點的區單位</label>
      <select id="globalAreaSelect">
        <option value="">請選擇</option>
      </select>
    </div>

    <div class="icon-grid" id="iconGrid"></div>
  </div>

  <div id="categoryView" style="display:none;">
    <button type="button" class="back-btn" id="backBtn">← 返回主頁</button>
    <div id="catDetail"></div>
  </div>

  <div id="offlineBanner" style="display:none; margin-top:14px; padding:10px 14px; background:var(--mustard-light); color:#7A5217; border-radius:10px; font-size:12px; font-weight:500;">
    目前無法連上共用雲端儲存，資料暫時只存在這個頁面，重新整理或分享給別人將看不到剛剛的變更。
  </div>

  <p class="footer-note">此表為所有參與者共用，新增或刪除項目大家都看得到，請確認資訊正確再送出。</p>
  <div class="reset-link" id="resetLinkWrap">
    <button id="resetAllBtn" type="button">清空全部資料</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="lineReportModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-icon">📣</div>
    <p class="modal-text">開啟LINE後請選擇「2026 戶外活動」的群組，會將該區提供的餐點資訊全部分享在群組。</p>
    <p class="modal-thanks">感謝您的用心、付出</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="lineModalCancel">取消</button>
      <button type="button" class="btn btn-primary" id="lineModalConfirm">開啟LINE</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'meal-entries-v1';
const SEED_FLAG_KEY = 'meal-entries-seeded-v1';

let entries = [];
let openCats = {};
let storageOk = true;
let currentView = 'home';
let selectedArea = '';
const PREFERRED_AREA_KEY = 'preferred-area-v1';

const DEFAULT_SEED = [{
  id: 'seed1',
  category: '麵食類',
  name: '炒米粉',
  qty: '2鍋悶燒鍋',
  vegType: '',
  area: '斗六區',
  provider: '高太太',
  note: ''
}];

function uid(){
  return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

async function safeStorageGet(key, shared, retries){
  retries = retries === undefined ? 1 : retries;
  for(let i=0; i<=retries; i++){
    try{
      return await window.storage.get(key, shared);
    }catch(e){
      if(i===retries){
        console.error('storage get failed', key, e);
        return null;
      }
      await new Promise(r=>setTimeout(r, 300));
    }
  }
  return null;
}

async function safeStorageSet(key, value, shared, retries){
  retries = retries === undefined ? 1 : retries;
  for(let i=0; i<=retries; i++){
    try{
      const result = await window.storage.set(key, value, shared);
      if(result) return true;
    }catch(e){
      if(i===retries){
        console.error('storage set failed', key, e);
        return false;
      }
    }
    await new Promise(r=>setTimeout(r, 300));
  }
  return false;
}

async function loadEntries(){
  if(!window.storage){
    storageOk = false;
    entries = DEFAULT_SEED.slice();
    return;
  }

  const seeded = await safeStorageGet(SEED_FLAG_KEY, true);
  if(!seeded){
    const savedInit = await safeStorageSet(STORAGE_KEY, JSON.stringify(DEFAULT_SEED), true);
    if(savedInit){
      await safeStorageSet(SEED_FLAG_KEY, 'true', true);
    }
  }

  const res = await safeStorageGet(STORAGE_KEY, true);
  if(res && res.value){
    try{
      entries = JSON.parse(res.value);
      storageOk = true;
      return;
    }catch(e){
      console.error('parse failed', e);
    }
  }

  if(res === null){
    storageOk = false;
    entries = entries.length ? entries : DEFAULT_SEED.slice();
  }else{
    storageOk = true;
    entries = [];
  }
}

async function saveEntries(){
  if(!window.storage || !storageOk){
    storageOk = false;
    return false;
  }
  const ok = await safeStorageSet(STORAGE_KEY, JSON.stringify(entries), true);
  if(!ok){
    storageOk = false;
    showToast('雲端連線異常，此次變更僅保留在本頁面');
  }
  return ok;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function updateStats(){
  let filledCats = 0;
  CATEGORIES.forEach(cat=>{
    if(entries.some(e=>e.category===cat.key)) filledCats++;
  });
  document.getElementById('statTotal').textContent = entries.length;
  document.getElementById('statCats').textContent = filledCats;
  document.getElementById('statEmpty').textContent = CATEGORIES.length - filledCats;
}

function renderIconGrid(){
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const count = entries.filter(e=>e.category===cat.key).length;
    const tile = document.createElement('div');
    tile.className = 'icon-btn-tile';
    tile.innerHTML = `
      <div class="icon-img-wrap"><img src="${ICON_DATA[cat.key]}" alt="${cat.key}" /></div>
      <div class="icon-label">${cat.key}</div>
      <div class="icon-count">${count} 項</div>
    `;
    tile.addEventListener('click', ()=>{
      openCategory(cat.key);
    });
    grid.appendChild(tile);
  });

  const lineTile = document.createElement('div');
  lineTile.className = 'icon-btn-tile';
  lineTile.innerHTML = `
    <div class="icon-img-wrap line-icon-wrap">
      <svg viewBox="0 0 56 56" width="100%" height="100%">
        <rect width="56" height="56" rx="28" fill="#06C755"/>
        <path d="M28 14c-8.3 0-15 5.4-15 12.1 0 6 5.3 11 12.4 11.9.5.1 1.1.3 1.3.8.1.4.1 1 .05 1.4l-.2 1.3c-.06.4-.3 1.5 1.3.8s8.6-5.1 11.7-8.7c2.2-2.4 3.2-4.8 3.2-7.5C42.75 19.4 36.3 14 28 14z" fill="#fff"/>
      </svg>
    </div>
    <div class="icon-label">餐點回報</div>
    <div class="icon-count">分享至LINE</div>
  `;
  lineTile.addEventListener('click', openLineReportModal);
  grid.appendChild(lineTile);
}

function buildLineReportText(){
  if(!selectedArea){
    showToast('請先在上方選擇提供餐點的區單位');
    return null;
  }
  const areaEntries = entries.filter(e=>e.area===selectedArea);
  if(areaEntries.length===0){
    showToast('目前還沒有「' + selectedArea + '」提供的餐點資料');
    return null;
  }
  const blocks = [];
  CATEGORIES.forEach(cat=>{
    const catEntries = areaEntries.filter(e=>e.category===cat.key);
    if(catEntries.length===0) return;
    const lines = [];
    lines.push(cat.key + (CATEGORY_EMOJI[cat.key]||'') + '提供');
    const showVeg = !NO_VEG_CATS.includes(cat.key);
    catEntries.forEach(en=>{
      const parts = [en.name];
      if(showVeg && en.vegType) parts.push(en.vegType);
      if(en.qty) parts.push(en.qty);
      if(en.provider) parts.push(en.provider + '提供');
      let line = parts.filter(Boolean).join(' ');
      if(en.note) line += ' · ' + en.note;
      lines.push(line);
    });
    blocks.push(lines.join('\n'));
  });
  return selectedArea + '\n' + blocks.join('\n\n');
}

function openLineReportModal(){
  const text = buildLineReportText();
  if(text === null) return;
  document.getElementById('lineReportModal').style.display = 'flex';
  document.getElementById('lineReportModal').dataset.reportText = text;
}

function closeLineReportModal(){
  document.getElementById('lineReportModal').style.display = 'none';
}

function confirmLineReport(){
  const text = document.getElementById('lineReportModal').dataset.reportText || '';
  const lineUrl = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  closeLineReportModal();
  const win = window.open(lineUrl, '_blank');
  if(!win){
    window.location.href = lineUrl;
  }
}

function showHome(){
  currentView = 'home';
  document.getElementById('homeView').style.display = '';
  document.getElementById('categoryView').style.display = 'none';
  renderIconGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

function openCategory(key){
  currentView = key;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('categoryView').style.display = '';
  renderCategoryDetail(key);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderCategoryDetail(key){
  const cat = CATEGORIES.find(c=>c.key===key);
  if(!cat){ showHome(); return; }
  const detail = document.getElementById('catDetail');
  detail.innerHTML = '';

  const catEntries = entries.filter(e=>e.category===cat.key);

  const headRow = document.createElement('div');
  headRow.className = 'cat-detail-head';
  headRow.innerHTML = `
    <span class="cat-detail-icon"><img src="${ICON_DATA[cat.key]}" alt="${cat.key}" /></span>
    <span class="cat-name">${cat.key}</span>
    <span class="cat-count">${catEntries.length} 項</span>

  detail.appendChild(headRow);

  const card = document.createElement('div');
  card.className = 'cat static';

  const body = document.createElement('div');
  body.className = 'cat-body';

  if(catEntries.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty-row';
    empty.textContent = '目前還沒有人認領這個分類';
    body.appendChild(empty);
  }else{
    catEntries.forEach(en=>{
      const row = document.createElement('div');
      row.className = 'entry';
      const showVeg = !NO_VEG_CATS.includes(cat.key);
      const provideLine = en.provider ? en.provider + '提供' : '';
      const metaLine = [en.qty, provideLine].filter(Boolean).join(' ');
      row.innerHTML = `
        <div>
          <div class="entry-main">
            ${escapeHtml(en.name || '（未填品名）')}
            ${showVeg && en.vegType ? `<span class="badge">${escapeHtml(en.vegType)}</span>` : ''}
          </div>
          <div class="entry-meta">
            ${escapeHtml(metaLine)}${en.note ? ' · ' + escapeHtml(en.note) : ''}
          </div>
        </div>
        <div class="entry-actions" data-entry-id="${en.id}">
          <button class="icon-btn" data-action="delete" data-id="${en.id}" aria-label="刪除">✕</button>
        </div>
      `;
      body.appendChild(row);
    });
  }

  const showVegField = !NO_VEG_CATS.includes(cat.key);
  const form = document.createElement('div');
  form.className = 'form show';
  form.innerHTML = `
    <div>
      <label>品名 *</label>
      <input type="text" data-field="name" placeholder="例如：${NAME_PLACEHOLDERS[cat.key] || ''}" />
      <div class="err" data-err="name">請輸入品名</div>
    </div>
    <div class="row2">
      <div>
        <label>份量</label>
        <input type="text" data-field="qty" placeholder="例如：${QTY_PLACEHOLDERS[cat.key] || ''}" />
      </div>
      ${showVegField ? `
      <div>
        <label>素食類別</label>
        <select data-field="vegType">
          <option value="">請選擇</option>
          ${VEG_OPTIONS.map(v=>`<option value="${v}">${v}</option>`).join('')}
        </select>
      </div>
      ` : `<div></div>`}
    </div>
    <div>
      <label>提供前賢</label>
      <input type="text" data-field="provider" placeholder="姓名" />
    </div>
    <div>
      <label>備註</label>
      <input type="text" data-field="note" placeholder="選填" />
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" data-action="cancel">清除欄位</button>
      <button type="button" class="btn btn-primary" data-action="submit">送出登記</button>
    </div>
  `;

  form.querySelector('[data-action="cancel"]').addEventListener('click', ()=>{
    form.querySelectorAll('input').forEach(i=>i.value='');
    const vegField = form.querySelector('[data-field="vegType"]');
    if(vegField) vegField.value='';
    form.querySelector('[data-err="name"]').classList.remove('show');
  });

  form.querySelector('[data-action="submit"]').addEventListener('click', async ()=>{
    const nameInput = form.querySelector('[data-field="name"]');
    const errEl = form.querySelector('[data-err="name"]');
    const name = nameInput.value.trim();
    if(!name){
      errEl.classList.add('show');
      nameInput.focus();
      return;
    }
    errEl.classList.remove('show');

    const vegField = form.querySelector('[data-field="vegType"]');
    const newEntry = {
      id: uid(),
      category: cat.key,
      name: name,
      qty: form.querySelector('[data-field="qty"]').value.trim(),
      vegType: vegField ? vegField.value : '',
      area: selectedArea,
      provider: form.querySelector('[data-field="provider"]').value.trim(),
      note: form.querySelector('[data-field="note"]').value.trim()
    };
    entries.push(newEntry);
    await saveEntries();
    showToast('已登記「' + name + '」');
    updateStats();
    renderCategoryDetail(key);
  });

  nameInputEnterSubmit(form);

  const formLabel = document.createElement('div');
  formLabel.className = 'add-btn';
  formLabel.style.cursor = 'default';
  formLabel.style.textAlign = 'left';
  formLabel.textContent = '我要提供' + cat.key;

  body.appendChild(formLabel);
  body.appendChild(form);
  card.appendChild(body);
  detail.appendChild(card);

  const switchSection = document.createElement('div');
  switchSection.className = 'switch-section';
  switchSection.innerHTML = `<div class="switch-title">切換到其他分類</div>`;
  const switchGrid = document.createElement('div');
  switchGrid.className = 'icon-grid';
  CATEGORIES.filter(c=>c.key!==cat.key).forEach(otherCat=>{
    const count = entries.filter(e=>e.category===otherCat.key).length;
    const tile = document.createElement('div');
    tile.className = 'icon-btn-tile';
    tile.innerHTML = `
      <div class="icon-img-wrap"><img src="${ICON_DATA[otherCat.key]}" alt="${otherCat.key}" /></div>
      <div class="icon-label">${otherCat.key}</div>
      <div class="icon-count">${count} 項</div>
    `;
    tile.addEventListener('click', ()=>{
      openCategory(otherCat.key);
    });
    switchGrid.appendChild(tile);
  });
  switchSection.appendChild(switchGrid);
  detail.appendChild(switchSection);

  detail.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-id');
      const actionsDiv = e.currentTarget.closest('.entry-actions');
      const entryRow = actionsDiv.closest('.entry');
      entryRow.classList.add('confirming');
      actionsDiv.innerHTML = `
        <span class="confirm-text">確定刪除？</span>
        <button type="button" class="confirm-btn confirm-yes" data-confirm-yes="${id}">刪除</button>
        <button type="button" class="confirm-btn confirm-no" data-confirm-no>取消</button>
      `;
      actionsDiv.querySelector('[data-confirm-yes]').addEventListener('click', async ()=>{
        entries = entries.filter(x=>x.id!==id);
        await saveEntries();
        showToast('已刪除');
        updateStats();
        renderCategoryDetail(key);
      });
      actionsDiv.querySelector('[data-confirm-no]').addEventListener('click', ()=>{
        entryRow.classList.remove('confirming');
      });
    });
  });
}

function nameInputEnterSubmit(form){
  form.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        form.querySelector('[data-action="submit"]').click();
      }
    });
  });
}

function escapeHtml(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function attachResetHandler(){
  const btn = document.getElementById('resetAllBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const wrap = document.getElementById('resetLinkWrap');
    wrap.innerHTML = `
      <span style="font-size:12px; color:var(--danger); font-weight:700;">確定要清空所有人的資料嗎？</span>
      <button type="button" class="confirm-btn confirm-yes" id="resetYes" style="margin-left:8px;">確定清空</button>
      <button type="button" class="confirm-btn confirm-no" id="resetNo" style="margin-left:6px;">取消</button>
    `;
    document.getElementById('resetYes').addEventListener('click', async ()=>{
      entries = [];
      await saveEntries();
      showToast('已清空所有資料');
      resetResetLink();
      updateStats();
      if(currentView === 'home'){
        renderIconGrid();
      }else{
        renderCategoryDetail(currentView);
      }
    });
    document.getElementById('resetNo').addEventListener('click', resetResetLink);
  });
}

function resetResetLink(){
  const wrap = document.getElementById('resetLinkWrap');
  wrap.innerHTML = `<button id="resetAllBtn" type="button">清空全部資料</button>`;
  attachResetHandler();
}

attachResetHandler();

function setupAreaSelect(){
  const sel = document.getElementById('globalAreaSelect');
  AREA_OPTIONS.forEach(a=>{
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  });
  sel.value = selectedArea;
  sel.addEventListener('change', async ()=>{
    selectedArea = sel.value;
    if(window.storage){
      await safeStorageSet(PREFERRED_AREA_KEY, selectedArea, false);
    }
  });
}

document.getElementById('backBtn').addEventListener('click', showHome);
document.getElementById('lineModalCancel').addEventListener('click', closeLineReportModal);
document.getElementById('lineModalConfirm').addEventListener('click', confirmLineReport);

(async function init(){
  await loadEntries();
  document.getElementById('offlineBanner').style.display = storageOk ? 'none' : 'block';

  if(window.storage){
    const pref = await safeStorageGet(PREFERRED_AREA_KEY, false);
    if(pref && pref.value) selectedArea = pref.value;
  }
  setupAreaSelect();

  updateStats();
  showHome();
})();
</script>
</body>
</html>
